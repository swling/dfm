# Parent directory used as the default for newly created virtual hosts.
WEB_ROOT="/home/wwwroot"
# Default site root for unmatched hostnames.
DEFAULT_WEB_ROOT="/home/wwwroot/default"
# Per-site access logs are written here when enabled by "dfm vhost add".
FRANKENPHP_LOG_DIR="/var/log/frankenphp"
# MySQL data directory; can point to a dedicated disk.
MYSQL_DATA_DIR="/var/lib/mysql"

# PHP branch to install. Leave empty to select interactively from all branches
# the repository offers; the highest available branch is the default.
PHP_VERSION=""
# MySQL exact version from the Oracle APT repository, e.g. 8.4.7-1.el9.
# Leave empty to select interactively; the newest LTS is the default.
MYSQL_VERSION=""
# Optional ACME contact address used by Caddy's automatic HTTPS.
# Leave empty to let Caddy use its default ACME account behavior.
ACME_EMAIL=""

# ---- Probe and platform parameters ----
# Used by install.sh, upgrade.sh and dfm. Change these here instead of
# editing the functions in dfm-common.sh or the installer.

# PHP branches are discovered automatically: every branch with a live
# repository is offered, and the highest one is the default.
# Per-branch timeout, in seconds, for the repository Release probe.
PHP_BRANCH_PROBE_TIMEOUT=20

# Minimum MySQL major version offered by the Oracle APT repository.
MYSQL_MIN_MAJOR_VERSION=8
# Minimum Debian major version required by this profile.
MIN_DEBIAN_MAJOR=13

# Supported CPU architectures (space-separated).
MYSQL_ARCHITECTURES="amd64"
FRANKENPHP_ARCHITECTURES="amd64 arm64"

# Oracle MySQL repository signing key.
MYSQL_GPG_KEY_URL="https://repo.mysql.com/RPM-GPG-KEY-mysql-2025"
MYSQL_GPG_FINGERPRINT="BCA43417C3B485DD128EC6D4B7B3B788A8D3785C"

# FrankenPHP admin endpoint and the probe used before starting the service.
FRANKENPHP_ADMIN_URL="http://localhost:2019"
FRANKENPHP_STOP_POLL_ATTEMPTS=25
FRANKENPHP_STOP_POLL_INTERVAL=0.2
