# Parent directory used as the default for newly created virtual hosts.
WEB_ROOT="/home/wwwroot"
# Default site root for unmatched hostnames.
DEFAULT_WEB_ROOT="/home/wwwroot/default"
# Per-site access logs are written here when enabled by "dfm vhost add".
FRANKENPHP_LOG_DIR="/var/log/frankenphp"
# MySQL keeps its own data directory; this part is unchanged from LNMP Debian.
MYSQL_DATA_DIR="/var/lib/mysql"

# PHP branch shipped by the FrankenPHP deb repository: 8.2, 8.3, 8.4 or 8.5.
# Leave empty to select interactively from the branches the repository offers.
PHP_VERSION=""
# MySQL exact version from the Oracle APT repository, e.g. 8.4.7-1.el9.
# Leave empty to select interactively; the newest LTS is the default.
MYSQL_VERSION=""
# Optional ACME contact address used by Caddy's automatic HTTPS.
# Leave empty to let Caddy use its default ACME account behavior.
ACME_EMAIL=""
